server.port=${SERVER_PORT:8081}
# Nombre registrado en Eureka; el puerto se obtiene del registro.
services.account.base-url=http://account-service
services.customer.base-url=http://customer-service
services.managed-account.base-url=http://account-service
services.payment.base-url=http://payment-service
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
spring.security.oauth2.resourceserver.jwt.audiences=bff-web
services.account.connect-timeout=1s
services.account.read-timeout=2s
services.account.resilience.attempts=2
services.account.resilience.retry-wait=200ms
services.account.resilience.open-wait=10s
services.account.resilience.max-concurrent=10
# Evitar multiplicar los intentos con otro mecanismo de retry.
spring.cloud.loadbalancer.retry.enabled=false
