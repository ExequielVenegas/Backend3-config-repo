# Sin credenciales: los secretos se inyectan en cada cliente por variables de entorno.
bancoxyz.configuration.source=config-server
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.configuration.source=${bancoxyz.configuration.source}
server.shutdown=graceful
lab.kafka.topic=bancoxyz.cuentas.commands.v1
lab.kafka.dlt=bancoxyz.cuentas.commands.v1.dlt
